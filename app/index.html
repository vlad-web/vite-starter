<!-- Modal -->
<div class="modal-overlay" data-js-modal-overlay></div>

<div class="modal-window" data-popup="popup-request">
	
	<div class="modal-grid">

		<div class="modal-cell">

			<div class="modal-body">

				<button type="button" class="modal-close" data-js-modal-close aria-label="Закрыть модальное окно">
					<svg width="19" height="18" viewBox="0 0 19 18" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M17.7202 17.0135L1.45679 0.75" stroke="#202225" stroke-width="1.5" stroke-linecap="round"/>
						<path d="M0.749971 17.0135L17.0134 0.75" stroke="#202225" stroke-width="1.5" stroke-linecap="round"/>
					</svg>
				</button>

				<div class="modal-form">

					<div class="modal-head">

						<div class="modal-title">Request a quote</div>

						<div class="modal-descr">Please fill out the form or send an email: <a href="mailto:sales@j4b.org">sales@j4b.org</a></div>

					</div>

					

				</div>

			</div>

		</div>

	</div>

</div>

<div class="modal-window" data-popup="popup-thank">
	
	<div class="modal-grid">

		<div class="modal-cell">

			<div class="modal-body">

				<button type="button" class="modal-close" data-js-modal-close aria-label="Закрыть модальное окно">

						<path d="M0.749971 17.0135L17.0134 0.75" stroke="#202225" stroke-width="1.5" stroke-linecap="round"/>
					</svg>
				</button>

				<div class="modal-thank">

					<div class="modal-head">

						<div class="modal-title">Thank You!</div>

						<div class="modal-descr">Your request has been successfully submitted.</div>

					</div>

					<button type="button" data-js-modal-close  class="button button--blue">Ok</button>

				</div>

			</div>

		</div>

	</div>

</div>
